services:
  postgres:
    image: postgres:16
    container_name: sas-navegantes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sas
      POSTGRES_PASSWORD: sas_dev_local_only
      POSTGRES_DB: sas_navegantes
    ports:
      - "5432:5432"
    volumes:
      - sas_navegantes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sas -d sas_navegantes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sas_navegantes_pgdata:
